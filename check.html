<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LMS 퍼블리싱 현황</title>

  <style>
    :root {
      --primary: #2f5fd0;
      --primary-dark: #244ea9;
      --primary-soft: #eef4ff;
      --bg: #f3f6fa;
      --card: #ffffff;
      --text: #263246;
      --muted: #768297;
      --border: #d8e0eb;
      --line: #e9edf3;
      --success: #198754;
      --success-soft: #eaf8f0;
      --warning: #c47a10;
      --warning-soft: #fff6e5;
      --shadow: 0 12px 34px rgba(31, 45, 79, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", Arial, sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      max-width: 1180px;
      margin: 0 auto;
      padding: 32px 20px 50px;
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 22px;
    }

    .title-wrap h1 {
      margin: 0;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .title-wrap p {
      margin: 9px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--primary-soft);
      color: var(--primary);
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .badge::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--primary);
    }

    .summary-grid {
      display: grid;
      grid-template-columns: 1.2fr repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 20px;
    }

    .summary-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: var(--shadow);
    }

    .summary-label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .summary-value {
      font-size: 28px;
      font-weight: 800;
      line-height: 1;
    }

    .summary-sub {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .progress-card {
      padding: 20px 22px;
    }

    .progress-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .progress-title {
      font-size: 14px;
      font-weight: 800;
    }

    .progress-rate {
      color: var(--primary);
      font-size: 22px;
      font-weight: 800;
    }

    .progress-track {
      width: 100%;
      height: 10px;
      border-radius: 999px;
      background: #edf1f6;
      overflow: hidden;
    }

    .progress-bar {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, var(--primary), #5b7fe5);
      border-radius: inherit;
    }

    .content-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .content-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 20px 24px;
      border-bottom: 1px solid var(--line);
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0;
      font-size: 17px;
      font-weight: 800;
    }

    .section-title::before {
      content: "";
      width: 5px;
      height: 18px;
      border-radius: 3px;
      background: var(--primary);
    }

    .content-head span {
      color: var(--muted);
      font-size: 12px;
    }

    .document-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
    }


    .document-divider {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 20px 22px 12px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.02em;
      background: #fff;
    }

    .document-divider::before,
    .document-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .document-divider.first {
      padding-top: 14px;
    }

    .document-divider.section-start {
      margin-top: 6px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
    }

    .document-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px 22px;
      border-bottom: 1px solid var(--line);
      transition: 0.15s ease;
    }

    .document-item:nth-child(odd) {
      border-right: 1px solid var(--line);
    }

    .document-item:hover {
      background: #fafcff;
    }

    .document-icon {
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--primary-soft);
      color: var(--primary);
      font-size: 17px;
      font-weight: 900;
    }

    .document-info {
      min-width: 0;
      flex: 1;
    }

    .document-name {
      font-size: 15px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .document-path {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--success-soft);
      color: var(--success);
      font-size: 12px;
      font-weight: 800;
    }

    .status::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--success);
    }

    .arrow {
      color: #a3adbb;
      font-size: 18px;
      font-weight: 700;
      margin-left: 2px;
    }

    .footer-note {
      margin-top: 16px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
      text-align: right;
    }

    @media (max-width: 900px) {
      .summary-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .progress-card {
        grid-column: span 2;
      }
    }

    @media (max-width: 700px) {
      .page {
        padding: 20px 12px 36px;
      }

      .page-header {
        flex-direction: column;
      }

      .title-wrap h1 {
        font-size: 25px;
      }

      .summary-grid {
        grid-template-columns: 1fr 1fr;
      }

      .progress-card {
        grid-column: 1 / -1;
      }

      .document-list {
        grid-template-columns: 1fr;
      }

      .document-item:nth-child(odd) {
        border-right: 0;
      }
    }

    @media (max-width: 480px) {
      .summary-grid {
        grid-template-columns: 1fr;
      }

      .progress-card {
        grid-column: auto;
      }

      .content-head {
        align-items: flex-start;
        flex-direction: column;
      }

      .document-item {
        padding: 16px;
      }

      .status {
        display: none;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="page-header">
      <div class="title-wrap">
        <h1>LMS 퍼블리싱 현황</h1>
        <p>
          직업훈련 LMS 문서 화면 퍼블리싱 진행 현황입니다.<br />
          각 문서를 클릭하면 해당 화면을 바로 확인할 수 있습니다.
        </p>
      </div>

      <div class="badge">Publishing Dashboard</div>
    </header>

    <section class="summary-grid">
      <div class="summary-card progress-card">
        <div class="progress-top">
          <div class="progress-title">전체 퍼블리싱 진행률</div>
          <div class="progress-rate">100%</div>
        </div>

        <div class="progress-track">
          <div class="progress-bar"></div>
        </div>

        <div class="summary-sub">현재 등록된 8개 문서 화면 퍼블리싱 완료</div>
      </div>

      <div class="summary-card">
        <div class="summary-label">전체 화면</div>
        <div class="summary-value">8</div>
        <div class="summary-sub">등록된 문서 화면</div>
      </div>

      <div class="summary-card">
        <div class="summary-label">완료</div>
        <div class="summary-value">8</div>
        <div class="summary-sub">퍼블리싱 완료</div>
      </div>

      <div class="summary-card">
        <div class="summary-label">진행중</div>
        <div class="summary-value">0</div>
        <div class="summary-sub">추가 작업 예정</div>
      </div>
    </section>

    <section class="content-card">
      <div class="content-head">
        <h2 class="section-title">문서 화면 목록</h2>
        <span>화면명을 클릭하면 새 페이지로 이동합니다.</span>
      </div>

      <div class="document-list" id="documentList"></div>

      <script>
        /*
         * 파일을 추가할 때는 이 배열에 "파일명.html"만 넣으면 됩니다.
         * href 경로는 기존 규칙 그대로 /html/{파일명} 으로 자동 생성됩니다.
         */
        const documentFiles = [
          "eduDiary.html",
      "trainDiary.html",
      "counselingDiary.html",
      "scoringRubric.html",
      "questionSheet.html",
      "assessmentPlan.html",
      "assessmentResultSummary.html",
      "survey.html",
      "examTeacher.html",
      "examStudent.html",
      "solvingCreateTeacher.html",
      "scenarioStudent.html",
      "scenarioTeacher.html",
      "courseMangement.html",
      "courseRegistration.html",
      "courseList.html",
      "courseDetail.html",
      "ncsManagement.html",
      "ncsList_v2.html",
      "ncsRegistration.html",
      "ncsExamRegistration.html",
      "ncsExamSheetRegistration.html",
      "admissionStatus.html",
      "admissionApplicationList.html",
      "entryPopup.html",
      "surveyList.html",
      "surveyRegistration.html",
      "surveyResponsePopup.html"
        ];

        // 이 파일부터 아래쪽을 두 번째 그룹으로 구분합니다.
        const DIVIDER_FILE = "courseMangement.html";

        function fallbackTitle(fileName) {
          return fileName.replace(/\.html$/i, "");
        }

        function createDivider(text, className = "") {
          const divider = document.createElement("div");
          divider.className = `document-divider ${className}`.trim();
          divider.textContent = text;
          return divider;
        }

        function createDocumentItem(fileName, index) {
          const item = document.createElement("a");
          item.className = "document-item";
          item.href = `/html/${fileName}`;

          item.innerHTML = `
            <div class="document-icon">${String(index + 1).padStart(2, "0")}</div>
            <div class="document-info">
              <div class="document-name">${fallbackTitle(fileName)}</div>
              <div class="document-path">html/${fileName}</div>
            </div>
            <div class="status">완료</div>
            <div class="arrow">›</div>
          `;

          return item;
        }

        async function applyPageTitle(fileName, item) {
          try {
            const response = await fetch(`/html/${fileName}`);
            if (!response.ok) return;

            const html = await response.text();
            const doc = new DOMParser().parseFromString(html, "text/html");
            const pageTitle = doc.querySelector("title")?.textContent?.trim();

            if (pageTitle) {
              item.querySelector(".document-name").textContent = pageTitle;
            }
          } catch (error) {
            // file:// 등 fetch가 제한된 환경에서는 파일명을 그대로 표시합니다.
          }
        }

        function updateSummary(total) {
          const values = document.querySelectorAll(".summary-value");
          const subs = document.querySelectorAll(".summary-sub");

          if (values[0]) values[0].textContent = total;
          if (values[1]) values[1].textContent = total;
          if (values[2]) values[2].textContent = 0;

          const progressRate = document.querySelector(".progress-rate");
          if (progressRate) progressRate.textContent = "100%";

          const progressBar = document.querySelector(".progress-bar");
          if (progressBar) progressBar.style.width = "100%";

          if (subs[0]) subs[0].textContent = `현재 등록된 ${total}개 화면 퍼블리싱 완료`;
        }

        function renderDocumentList() {
          const list = document.getElementById("documentList");
          list.innerHTML = "";

          list.appendChild(createDivider("문서 / 평가 화면", "first"));

          documentFiles.forEach((fileName, index) => {
            if (fileName === DIVIDER_FILE) {
              list.appendChild(createDivider("과정 / 운영 관리", "section-start"));
            }

            const item = createDocumentItem(fileName, index);
            list.appendChild(item);
            applyPageTitle(fileName, item);
          });

          updateSummary(documentFiles.length);
        }

        renderDocumentList();
      </script>
    </section>

    <div class="footer-note">
      LMS Publishing Status · 화면 추가 시 문서 목록과 진행률을 함께 갱신하세요.
    </div>
  </main>
</body>

</html>
