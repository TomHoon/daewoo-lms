<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NCS 평가항목 등록</title>
<style>
:root{
  --primary:#2f5fd0;--primary-soft:#eef4ff;--border:#d8e0eb;--line:#e9edf3;
  --text:#263246;--muted:#768297;--bg:#f3f6fa;--soft:#f7f9fc;
  --success:#198754;--danger:#d9534f;--warning:#c47a10;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Pretendard,"Noto Sans KR",Arial,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
.page{max-width:1480px;margin:28px auto 60px;padding:0 18px}
.page-header{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:18px}
.page-title h1{margin:0;font-size:30px;font-weight:800}
.page-title p{margin:8px 0 0;color:var(--muted);font-size:14px}
.btn{border:1px solid var(--border);background:#fff;color:var(--text);border-radius:9px;padding:10px 14px;font-weight:800;font-size:13px}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn-danger{color:var(--danger)}
.btn-small{padding:7px 10px;font-size:12px}
.card{background:#fff;border:1px solid var(--border);border-radius:18px;box-shadow:0 12px 34px rgba(31,45,79,.07);overflow:hidden;margin-bottom:18px}
.card-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}
.section-title{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:800}
.section-title:before{content:"";width:5px;height:20px;border-radius:3px;background:var(--primary)}
.card-body{padding:18px 22px 22px}
.course-banner{background:#f8faff;border:1px solid #dbe6ff;border-radius:14px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.course-name{font-size:16px;font-weight:800}
.course-meta{margin-top:5px;color:var(--muted);font-size:12px}
.subnav{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.subnav .btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.notice{margin-top:12px;padding:11px 13px;border-radius:10px;background:#fff8f7;border:1px solid #ffd8d3;color:#b8443b;font-size:12px}
.form-row{display:grid;grid-template-columns:140px 1fr auto;gap:10px;align-items:center}
.form-row .label{font-size:13px;font-weight:800;color:#59667a}
.form-row input{width:100%;border:1px solid var(--border);border-radius:8px;padding:9px 10px;outline:none;background:#fff}
.unit-list{display:flex;flex-direction:column;gap:14px;margin-top:16px}
.unit-card{border:1px solid var(--border);border-radius:14px;overflow:hidden;background:#fff}
.unit-head{background:var(--soft);padding:12px 14px;display:grid;grid-template-columns:1fr 120px 110px 90px 90px 80px;gap:10px;align-items:end;border-bottom:1px solid var(--border)}
.field label{display:block;margin-bottom:6px;font-size:11px;font-weight:800;color:#667287}
.field input{width:100%;border:1px solid var(--border);border-radius:8px;padding:8px 9px;outline:none;background:#fff}
.checkbox-field{display:flex;align-items:center;justify-content:center;height:38px;border:1px solid var(--border);border-radius:8px;background:#fff}
.element-section{padding:14px}
.element-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.element-title{font-size:13px;font-weight:800;color:#59667a}
.element-row{display:grid;grid-template-columns:1fr 90px;gap:10px;margin-bottom:8px}
.element-row input{width:100%;border:1px solid var(--border);border-radius:8px;padding:8px 9px;outline:none}
.footer-actions{display:flex;justify-content:flex-end;gap:8px}
.empty{padding:18px;text-align:center;color:var(--muted);font-size:12px}
@media(max-width:1100px){.unit-head{grid-template-columns:1fr 1fr 1fr}.form-row{grid-template-columns:1fr}}
@media(max-width:650px){.page{padding:0 10px}.page-header{flex-direction:column}.unit-head{grid-template-columns:1fr}.element-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="page">
  <header class="page-header">
    <div class="page-title">
      <h1>NCS 평가항목 등록</h1>
      <p>교과목별 능력단위와 능력단위 요소를 등록합니다.</p>
    </div>
    <div><button class="btn" onclick="history.back()">NCS 평가목록</button></div>
  </header>

  <section class="card">
    <div class="card-body">
      <div class="course-banner">
        <div>
          <div class="course-name">[내일배움카드(실업자)] 한식 조리사 자격증 대비반</div>
          <div class="course-meta">교육기간 2026.11.04 ~ 2027.01.16 · 진행중</div>
        </div>
        <button class="btn btn-small" onclick="alert('CSV 등록 기능 영역입니다.')">CSV 파일로 항목 등록</button>
      </div>

      <div class="subnav">
        <button class="btn btn-small">NCS 평가항목 목록</button>
        <button class="btn btn-small active">NCS 평가항목 등록</button>
        <button class="btn btn-small">평가목록</button>
        <button class="btn btn-small">NCS 평가등록</button>
        <button class="btn btn-small">사전평가결과</button>
        <button class="btn btn-small">요소별 평가결과</button>
        <button class="btn btn-small">능력단위평가결과</button>
      </div>

      <div class="notice">교과목 아래에 능력단위를 등록하고, 각 능력단위별 요소를 추가할 수 있습니다.</div>
    </div>
  </section>

  <section class="card">
    <div class="card-head">
      <div class="section-title">NCS 평가항목</div>
    </div>
    <div class="card-body">
      <div class="form-row">
        <div class="label">교과목명</div>
        <input id="subjectName" value="바리스타">
        <button class="btn btn-primary btn-small" onclick="addUnit()">+ 능력단위 추가</button>
      </div>

      <div class="unit-list" id="unitList"></div>
    </div>
  </section>

  <div class="footer-actions">
    <button class="btn" onclick="history.back()">목록</button>
    <button class="btn btn-primary" onclick="saveAll()">저장</button>
  </div>
</div>

<script>
let unitSeq=0;
const units=[
  {
    name:"커피 원두 선택",code:"1601020101",hours:20,nonNcs:false,pretest:true,
    elements:["원두 특성 확인","원두 품질 판별","원두 보관 방법"]
  },
  {
    name:"커피기계 운용",code:"1601020202",hours:24,nonNcs:false,pretest:false,
    elements:["커피기계 구조 이해","기계 작동 점검","기계 세척 및 관리"]
  }
];

function render(){
  const root=document.getElementById("unitList");
  root.innerHTML="";
  if(!units.length){
    root.innerHTML='<div class="empty">등록된 능력단위가 없습니다.</div>';
    return;
  }

  units.forEach((u,i)=>{
    const card=document.createElement("div");
    card.className="unit-card";
    card.innerHTML=`
      <div class="unit-head">
        <div class="field">
          <label>능력단위명</label>
          <input value="${u.name}" onchange="units[${i}].name=this.value">
        </div>
        <div class="field">
          <label>분류번호</label>
          <input value="${u.code}" onchange="units[${i}].code=this.value">
        </div>
        <div class="field">
          <label>훈련시간</label>
          <input type="number" value="${u.hours}" onchange="units[${i}].hours=Number(this.value)">
        </div>
        <div class="field">
          <label>비NCS</label>
          <div class="checkbox-field"><input type="checkbox" ${u.nonNcs?"checked":""} onchange="units[${i}].nonNcs=this.checked"></div>
        </div>
        <div class="field">
          <label>사전평가</label>
          <div class="checkbox-field"><input type="checkbox" ${u.pretest?"checked":""} onchange="units[${i}].pretest=this.checked"></div>
        </div>
        <div class="field">
          <label>관리</label>
          <button class="btn btn-danger btn-small" onclick="removeUnit(${i})">삭제</button>
        </div>
      </div>
      <div class="element-section">
        <div class="element-head">
          <div class="element-title">능력단위 요소</div>
          <button class="btn btn-small" onclick="addElement(${i})">+ 요소 추가</button>
        </div>
        <div id="elements-${i}">
          ${u.elements.map((el,j)=>`
            <div class="element-row">
              <input value="${el}" onchange="units[${i}].elements[${j}]=this.value">
              <button class="btn btn-danger btn-small" onclick="removeElement(${i},${j})">삭제</button>
            </div>
          `).join("")}
        </div>
      </div>`;
    root.appendChild(card);
  });
}

function addUnit(){
  units.push({name:"",code:"",hours:0,nonNcs:false,pretest:false,elements:[""]});
  render();
}

function removeUnit(i){
  if(confirm("이 능력단위를 삭제하시겠습니까?")){
    units.splice(i,1);
    render();
  }
}

function addElement(i){
  units[i].elements.push("");
  render();
}

function removeElement(i,j){
  if(units[i].elements.length<=1){
    alert("최소 1개의 요소는 유지해야 합니다.");
    return;
  }
  units[i].elements.splice(j,1);
  render();
}

function saveAll(){
  const subject=document.getElementById("subjectName").value.trim();
  if(!subject){alert("교과목명을 입력하세요.");return;}
  if(!units.length){alert("능력단위를 1개 이상 등록하세요.");return;}
  if(units.some(u=>!u.name.trim())){alert("능력단위명을 모두 입력하세요.");return;}
  if(units.some(u=>u.elements.some(e=>!e.trim()))){alert("능력단위 요소명을 모두 입력하세요.");return;}

  alert(`저장 완료\n교과목: ${subject}\n능력단위: ${units.length}개`);
}

render();
</script>
</body>
</html>
