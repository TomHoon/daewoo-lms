<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>입학접수현황</title>
<style>
:root{
  --primary:#2f5fd0;--primary-soft:#eef4ff;--border:#d8e0eb;--line:#e9edf3;
  --text:#263246;--muted:#768297;--bg:#f3f6fa;--soft:#f7f9fc;--success:#198754;
  --danger:#d9534f;--pink:#e83e8c;--purple:#8a2be2;--warning:#c47a10;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Pretendard,"Noto Sans KR",Arial,sans-serif}
button{font:inherit;cursor:pointer}
.page{max-width:1500px;margin:28px auto 60px;padding:0 18px}
.page-header{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:18px}
.page-title h1{margin:0;font-size:30px;font-weight:800}.page-title p{margin:8px 0 0;color:var(--muted);font-size:14px}
.btn{border:1px solid var(--border);background:#fff;color:var(--text);border-radius:9px;padding:10px 14px;font-weight:800;font-size:13px}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
.card{background:#fff;border:1px solid var(--border);border-radius:18px;box-shadow:0 12px 34px rgba(31,45,79,.07);overflow:hidden;margin-bottom:18px}
.card-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}
.section-title{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:800}
.section-title:before{content:"";width:5px;height:20px;border-radius:3px;background:var(--primary)}
.card-body{padding:18px 22px 22px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{border:1px solid var(--border);background:#fff;border-radius:10px;padding:9px 13px;font-size:13px;font-weight:800;color:#50607a}
.tab.active{background:var(--primary-soft);border-color:#bfd0fb;color:var(--primary)}
.group-block{margin-top:18px}
.group-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px}
.group-title{font-size:14px;font-weight:800;color:#59667a}
.group-title strong{color:var(--primary)}
.table-wrap{border:1px solid var(--border);border-radius:12px;overflow:auto}
table{width:100%;border-collapse:collapse;min-width:1450px}
th{background:var(--soft);color:#59667a;font-size:12px;font-weight:800;padding:10px 8px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);text-align:center}
td{padding:10px 8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
tr:last-child td{border-bottom:0}
th:last-child,td:last-child{border-right:0}
.center{text-align:center}
.course-name{font-weight:800}
.date-range{font-weight:800;line-height:1.45}
.date-range .start{color:#1f6feb}.date-range .end{color:#d9534f}
.stat{font-weight:800}
.stat.pass{color:var(--success)}.stat.fail{color:var(--danger)}.stat.cancel{color:var(--pink)}.stat.today{color:var(--purple)}
.empty{padding:34px!important;text-align:center;color:var(--muted)}
.summary-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
.summary-card{border:1px solid var(--border);border-radius:14px;background:#fff;padding:16px}
.summary-label{font-size:12px;color:var(--muted);font-weight:800}.summary-value{margin-top:6px;font-size:25px;font-weight:800;color:var(--primary)}
.footer-note{margin-top:14px;text-align:right;color:var(--muted);font-size:12px}
@media(max-width:900px){.summary-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:650px){.page{padding:0 10px}.page-header{flex-direction:column}.summary-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="page">
  <header class="page-header">
    <div class="page-title">
      <h1>입학접수현황</h1>
      <p>훈련직종별 과정의 접수 및 입학 진행현황을 한눈에 확인합니다.</p>
    </div>
    <div>
      <button class="btn" onclick="exportExcel()">엑셀</button>
    </div>
  </header>

  <section class="card">
    <div class="card-head">
      <div class="section-title">접수 현황 요약</div>
      <div style="font-size:12px;color:var(--muted)">실시간 집계 기준</div>
    </div>
    <div class="card-body">
      <div class="summary-grid">
        <div class="summary-card"><div class="summary-label">전체 과정</div><div class="summary-value" id="sumCourses">0</div></div>
        <div class="summary-card"><div class="summary-label">총 접수</div><div class="summary-value" id="sumApplied">0</div></div>
        <div class="summary-card"><div class="summary-label">합격</div><div class="summary-value" id="sumPass">0</div></div>
        <div class="summary-card"><div class="summary-label">대기</div><div class="summary-value" id="sumWait">0</div></div>
        <div class="summary-card"><div class="summary-label">오늘 접수</div><div class="summary-value" id="sumToday">0</div></div>
      </div>

      <div class="tabs" id="tabs">
        <button class="tab active" data-tab="전체">전체보기</button>
        <button class="tab" data-tab="국가기간전략산업">국가기간전략산업</button>
        <button class="tab" data-tab="내일배움카드(실업자)">내일배움카드(실업자)</button>
        <button class="tab" data-tab="내일배움카드(재직자)">내일배움카드(재직자)</button>
        <button class="tab" data-tab="일반과정">일반과정</button>
      </div>

      <div id="groups"></div>
    </div>
  </section>

  <div class="footer-note">LMS 관리자 · 입학접수현황</div>
</div>

<script>
const rows = [
  {
    category:"국가기간전략산업", course:"AI 기반 클라우드 개발자 양성과정",
    clicks:156, teacher:"김현수", start:"2026.11.10", end:"2027.05.30",
    approved:24, applied:19, pre:2, receipt:5, interview:4, pass:6, fail:1, cancel:0, candidate:1, wait:0, today:2
  },
  {
    category:"내일배움카드(실업자)", course:"UI/UX 실무 디자이너 과정",
    clicks:98, teacher:"이서연", start:"2026.11.17", end:"2027.03.28",
    approved:20, applied:12, pre:1, receipt:3, interview:2, pass:4, fail:1, cancel:0, candidate:0, wait:1, today:1
  },
  {
    category:"내일배움카드(재직자)", course:"[대구] 재직자를 위한 고급 JAVA 개발",
    clicks:208, teacher:"박지훈", start:"2026.11.21", end:"2027.03.31",
    approved:17, applied:9, pre:0, receipt:2, interview:1, pass:5, fail:0, cancel:0, candidate:0, wait:1, today:0
  },
  {
    category:"일반과정", course:"커피 바리스타 자격증 대비반",
    clicks:44, teacher:"최민아", start:"2026.12.01", end:"2027.01.20",
    approved:16, applied:10, pre:1, receipt:3, interview:0, pass:4, fail:0, cancel:1, candidate:0, wait:1, today:1
  }
];

let currentTab = "전체";

function pct(applied, approved){
  if(!approved) return "0%";
  return Math.round((applied/approved)*100) + "%";
}

function render(){
  const filtered = currentTab==="전체" ? rows : rows.filter(r=>r.category===currentTab);
  const categories = [...new Set(filtered.map(r=>r.category))];
  const root = document.getElementById("groups");
  root.innerHTML = "";

  categories.forEach(cat=>{
    const items = filtered.filter(r=>r.category===cat);
    const wrap = document.createElement("div");
    wrap.className = "group-block";
    wrap.innerHTML = `
      <div class="group-head">
        <div class="group-title">${cat} <strong>(Total : ${items.length})</strong></div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th rowspan="2" style="width:58px">번호</th>
              <th rowspan="2">과정명</th>
              <th rowspan="2" style="width:70px">클릭</th>
              <th rowspan="2" style="width:90px">담임</th>
              <th rowspan="2" style="width:120px">교육기간</th>
              <th rowspan="2" style="width:70px">승인</th>
              <th rowspan="2" style="width:70px">접수</th>
              <th rowspan="2" style="width:80px">접수율</th>
              <th colspan="8">입학상태</th>
              <th rowspan="2" style="width:75px;color:#8a2be2">오늘<br>접수</th>
            </tr>
            <tr>
              <th>가접수</th><th>접수</th><th>면접</th><th style="color:#198754">합격</th>
              <th style="color:#d9534f">불합격</th><th style="color:#e83e8c">취소</th><th>후보</th><th>대기</th>
            </tr>
          </thead>
          <tbody>
            ${items.map((r,i)=>`
              <tr>
                <td class="center">${i+1}</td>
                <td><div class="course-name">${r.course}</div></td>
                <td class="center">${r.clicks}</td>
                <td class="center">${r.teacher}</td>
                <td class="center"><div class="date-range"><div class="start">${r.start}</div><div class="end">${r.end}</div></div></td>
                <td class="center">${r.approved}</td>
                <td class="center stat">${r.applied}</td>
                <td class="center stat">${pct(r.applied,r.approved)}</td>
                <td class="center">${r.pre}</td>
                <td class="center">${r.receipt}</td>
                <td class="center">${r.interview}</td>
                <td class="center stat pass">${r.pass}</td>
                <td class="center stat fail">${r.fail}</td>
                <td class="center stat cancel">${r.cancel}</td>
                <td class="center">${r.candidate}</td>
                <td class="center">${r.wait}</td>
                <td class="center stat today">${r.today}</td>
              </tr>
            `).join("") || `<tr><td class="empty" colspan="17">등록된 과정이 없습니다.</td></tr>`}
          </tbody>
        </table>
      </div>`;
    root.appendChild(wrap);
  });

  document.getElementById("sumCourses").textContent = filtered.length;
  document.getElementById("sumApplied").textContent = filtered.reduce((s,r)=>s+r.applied,0);
  document.getElementById("sumPass").textContent = filtered.reduce((s,r)=>s+r.pass,0);
  document.getElementById("sumWait").textContent = filtered.reduce((s,r)=>s+r.wait,0);
  document.getElementById("sumToday").textContent = filtered.reduce((s,r)=>s+r.today,0);
}

document.querySelectorAll(".tab").forEach(tab=>{
  tab.addEventListener("click",()=>{
    document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
    tab.classList.add("active");
    currentTab = tab.dataset.tab;
    render();
  });
});

function exportExcel(){
  alert("엑셀 다운로드 기능 영역입니다. 실제 LMS에서는 서버에서 엑셀 파일을 생성해 내려받습니다.");
}

render();
</script>
</body>
</html>
