server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index /check.html;

    location / {
        try_files $uri $uri/ check.html;
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    error_page 404 /check.html;
}