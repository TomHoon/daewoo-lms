<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>과정분류 관리</title>
<style>
:root{
  --primary:#2f5fd0;--primary-soft:#eef4ff;--border:#d8e0eb;--line:#e9edf3;
  --text:#263246;--muted:#768297;--bg:#f3f6fa;--soft:#f7f9fc;--danger:#d9534f;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Pretendard,"Noto Sans KR",Arial,sans-serif}
button,input{font:inherit}button{cursor:pointer}
.page{max-width:1480px;margin:28px auto 50px;padding:0 18px}
.page-header{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:18px}
.page-title h1{margin:0;font-size:30px;font-weight:800}.page-title p{margin:8px 0 0;color:var(--muted);font-size:14px}
.badge{padding:8px 12px;border-radius:999px;background:var(--primary-soft);color:var(--primary);font-size:13px;font-weight:800}
.layout{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.panel{background:#fff;border:1px solid var(--border);border-radius:18px;box-shadow:0 12px 34px rgba(31,45,79,.07);overflow:hidden}
.panel-head{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.panel-title{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800}.panel-title:before{content:"";width:5px;height:20px;border-radius:3px;background:var(--primary)}
.panel-desc{font-size:12px;color:var(--muted)}.panel-body{padding:18px 20px 22px}
.create-box{border:1px solid var(--border);border-radius:14px;background:#fbfcfe;padding:16px;margin-bottom:16px}
.create-grid{display:grid;grid-template-columns:100px 1fr 100px 100px 90px;gap:10px;align-items:end}
.field label{display:block;margin-bottom:7px;font-size:12px;color:#667287;font-weight:800}
.field input[type="text"],.field input[type="number"]{width:100%;border:1px solid var(--border);border-radius:9px;padding:10px 11px;outline:none;background:#fff}
.check-field{display:flex;align-items:center;justify-content:center;height:42px;border:1px solid var(--border);border-radius:9px;background:#fff}
.btn{border:1px solid var(--border);background:#fff;color:var(--text);border-radius:9px;padding:10px 14px;font-weight:800;font-size:13px}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn-danger{color:var(--danger)}.btn-small{padding:7px 10px;font-size:12px}
.notice{margin:0 0 12px;padding:10px 12px;border-radius:10px;background:#f7faff;color:var(--primary);font-size:12px;font-weight:700}
.table-wrap{border:1px solid var(--border);border-radius:12px;overflow:auto}
table{width:100%;border-collapse:collapse;min-width:720px}
th{background:var(--soft);color:#59667a;font-size:12px;font-weight:800;padding:12px 10px;border-bottom:1px solid var(--border);text-align:center}
td{border-bottom:1px solid var(--line);padding:10px;font-size:13px;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}tbody tr:hover{background:#fbfcff}
td input[type="text"],td input[type="number"]{width:100%;border:1px solid #dfe5ec;border-radius:7px;padding:8px 9px;outline:none;background:#fff}
.center{text-align:center}
.course-count{display:inline-flex;min-width:32px;height:28px;padding:0 9px;align-items:center;justify-content:center;border-radius:999px;background:var(--primary-soft);color:var(--primary);font-weight:800;cursor:pointer}
.course-count.zero{background:#f2f4f7;color:#8e99a8}
.actions{display:flex;gap:6px;justify-content:flex-end;margin-top:14px}.footer-note{margin-top:16px;color:var(--muted);font-size:12px;text-align:right}
@media(max-width:1100px){.layout{grid-template-columns:1fr}}
@media(max-width:760px){.page{padding:0 10px}.page-header{flex-direction:column}.create-grid{grid-template-columns:1fr 1fr}.create-grid .field:nth-child(2){grid-column:1/-1}.create-grid .btn{grid-column:1/-1}}
</style>
</head>
<body>
<div class="page">
<header class="page-header">
  <div class="page-title">
    <h1>과정분류 관리</h1>
    <p>훈련직종분류와 교육과정분류를 등록하고 각 분류에 연결된 과정을 관리합니다.</p>
  </div>
  <div class="badge">Course Classification</div>
</header>

<div class="layout">
<section class="panel">
  <div class="panel-head">
    <div class="panel-title">훈련직종분류</div>
    <div class="panel-desc">직종별 상위 분류 관리</div>
  </div>
  <div class="panel-body">
    <div class="create-box">
      <div class="create-grid">
        <div class="field"><label>출력순서</label><input type="number" id="jobOrder" value="0"></div>
        <div class="field"><label>훈련직종분류명</label><input type="text" id="jobName" placeholder="훈련직종분류명 입력"></div>
        <div class="field"><label>재직자</label><div class="check-field"><input type="checkbox" id="jobWorker"></div></div>
        <div class="field"><label>숨김</label><div class="check-field"><input type="checkbox" id="jobHidden"></div></div>
        <button class="btn btn-primary" onclick="addJobCategory()">+ 추가</button>
      </div>
    </div>

    <div class="notice">등록과정 수를 클릭하면 해당 분류에 속한 과정 목록 화면으로 이동합니다.</div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th style="width:50px"><input type="checkbox" onclick="toggleAll(this,'jobRowCheck')"></th>
            <th style="width:100px">출력순서</th>
            <th>훈련직종분류명</th>
            <th style="width:90px">재직자</th>
            <th style="width:80px">숨김</th>
            <th style="width:100px">등록과정수</th>
          </tr>
        </thead>
        <tbody id="jobBody"></tbody>
      </table>
    </div>

    <div class="actions">
      <button class="btn btn-small" onclick="saveJobRows()">수정</button>
      <button class="btn btn-small btn-danger" onclick="deleteChecked('job')">삭제</button>
    </div>
  </div>
</section>

<section class="panel">
  <div class="panel-head">
    <div class="panel-title">교육과정분류</div>
    <div class="panel-desc">과정 성격별 세부 분류 관리</div>
  </div>
  <div class="panel-body">
    <div class="create-box">
      <div class="create-grid" style="grid-template-columns:1fr 100px 90px">
        <div class="field"><label>교육과정분류명</label><input type="text" id="courseName" placeholder="교육과정분류명 입력"></div>
        <div class="field"><label>숨김</label><div class="check-field"><input type="checkbox" id="courseHidden"></div></div>
        <button class="btn btn-primary" onclick="addCourseCategory()">+ 추가</button>
      </div>
    </div>

    <div class="notice">등록과정 수를 클릭하면 해당 분류에 속한 과정 목록 화면으로 이동합니다.</div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th style="width:50px"><input type="checkbox" onclick="toggleAll(this,'courseRowCheck')"></th>
            <th>교육과정분류명</th>
            <th style="width:90px">순서</th>
            <th style="width:80px">숨김</th>
            <th style="width:100px">등록과정수</th>
          </tr>
        </thead>
        <tbody id="courseBody"></tbody>
      </table>
    </div>

    <div class="actions">
      <button class="btn btn-small" onclick="saveCourseRows()">수정</button>
      <button class="btn btn-small btn-danger" onclick="deleteChecked('course')">삭제</button>
    </div>
  </div>
</section>
</div>

<div class="footer-note">LMS 관리자 · 과정분류 관리</div>
</div>

<script>
const jobs=[
  {order:0,name:"국가기간전략산업",worker:false,hidden:false,count:1},
  {order:0,name:"내일배움카드(실업자)",worker:false,hidden:false,count:5},
  {order:0,name:"내일배움카드(재직자)",worker:true,hidden:false,count:1},
  {order:0,name:"일반과정",worker:false,hidden:false,count:1}
];
const courses=[
  {name:"컴퓨터활용",order:1,hidden:false,count:0},
  {name:"UI/UX디자인",order:2,hidden:false,count:1},
  {name:"프로그래밍",order:3,hidden:false,count:1},
  {name:"바리스타",order:4,hidden:false,count:3},
  {name:"한식 조리사",order:5,hidden:false,count:3}
];
function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;")}
function renderJobs(){
  const body=document.getElementById("jobBody");body.innerHTML="";
  jobs.forEach((row,i)=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`<td class="center"><input type="checkbox" class="jobRowCheck" data-index="${i}"></td>
    <td><input type="number" value="${row.order}" onchange="jobs[${i}].order=Number(this.value)"></td>
    <td><input type="text" value="${esc(row.name)}" onchange="jobs[${i}].name=this.value"></td>
    <td class="center"><input type="checkbox" ${row.worker?"checked":""} onchange="jobs[${i}].worker=this.checked"></td>
    <td class="center"><input type="checkbox" ${row.hidden?"checked":""} onchange="jobs[${i}].hidden=this.checked"></td>
    <td class="center"><span class="course-count ${row.count===0?"zero":""}" onclick="openCourses('job',${i})">${row.count}</span></td>`;
    body.appendChild(tr);
  });
}
function renderCourses(){
  const body=document.getElementById("courseBody");body.innerHTML="";
  courses.forEach((row,i)=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`<td class="center"><input type="checkbox" class="courseRowCheck" data-index="${i}"></td>
    <td><input type="text" value="${esc(row.name)}" onchange="courses[${i}].name=this.value"></td>
    <td><input type="number" value="${row.order}" onchange="courses[${i}].order=Number(this.value)"></td>
    <td class="center"><input type="checkbox" ${row.hidden?"checked":""} onchange="courses[${i}].hidden=this.checked"></td>
    <td class="center"><span class="course-count ${row.count===0?"zero":""}" onclick="openCourses('course',${i})">${row.count}</span></td>`;
    body.appendChild(tr);
  });
}
function addJobCategory(){
  const name=document.getElementById("jobName").value.trim();
  if(!name){alert("훈련직종분류명을 입력하세요.");return}
  jobs.push({order:Number(document.getElementById("jobOrder").value||0),name,worker:document.getElementById("jobWorker").checked,hidden:document.getElementById("jobHidden").checked,count:0});
  document.getElementById("jobName").value="";renderJobs();
}
function addCourseCategory(){
  const name=document.getElementById("courseName").value.trim();
  if(!name){alert("교육과정분류명을 입력하세요.");return}
  const maxOrder=courses.length?Math.max(...courses.map(x=>x.order)):0;
  courses.push({name,order:maxOrder+1,hidden:document.getElementById("courseHidden").checked,count:0});
  document.getElementById("courseName").value="";renderCourses();
}
function toggleAll(master,cls){document.querySelectorAll("."+cls).forEach(el=>el.checked=master.checked)}
function deleteChecked(type){
  const cls=type==="job"?"jobRowCheck":"courseRowCheck";
  const arr=type==="job"?jobs:courses;
  const checked=[...document.querySelectorAll("."+cls+":checked")].map(el=>Number(el.dataset.index)).sort((a,b)=>b-a);
  if(!checked.length){alert("삭제할 항목을 선택하세요.");return}
  if(!confirm("선택한 분류를 삭제하시겠습니까?"))return;
  checked.forEach(i=>arr.splice(i,1));
  type==="job"?renderJobs():renderCourses();
}
function saveJobRows(){alert("훈련직종분류 수정사항을 저장했습니다.")}
function saveCourseRows(){alert("교육과정분류 수정사항을 저장했습니다.")}
function openCourses(type,index){
  const row=type==="job"?jobs[index]:courses[index];
  alert(`"${row.name}" 분류의 등록과정 목록으로 이동합니다.\n현재 등록과정: ${row.count}개`);
}
renderJobs();renderCourses();
</script>
</body>
</html>
