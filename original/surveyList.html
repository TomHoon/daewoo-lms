<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>설문조사 목록</title>
<style>
:root{
  --primary:#2f5fd0;--primary-soft:#eef4ff;--border:#d8e0eb;--line:#e9edf3;
  --text:#263246;--muted:#768297;--bg:#f3f6fa;--soft:#f7f9fc;
  --success:#198754;--warning:#c47a10;--danger:#d9534f;--purple:#7b2cbf;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo",Arial,sans-serif;
}
button,input,select{font:inherit}
button{cursor:pointer}
.page{max-width:1480px;margin:28px auto 60px;padding:0 18px}
.page-header{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:18px}
.page-title h1{margin:0;font-size:30px;font-weight:800}
.page-title p{margin:8px 0 0;color:var(--muted);font-size:14px}
.btn{
  border:1px solid var(--border);background:#fff;color:var(--text);
  border-radius:9px;padding:10px 14px;font-weight:800;font-size:13px
}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn-danger{color:var(--danger)}
.btn-small{padding:7px 10px;font-size:12px}
.card{
  background:#fff;border:1px solid var(--border);border-radius:18px;
  box-shadow:0 12px 34px rgba(31,45,79,.07);overflow:hidden;margin-bottom:18px
}
.card-head{
  padding:18px 22px;border-bottom:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:center;gap:12px
}
.section-title{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:800}
.section-title:before{content:"";width:5px;height:20px;border-radius:3px;background:var(--primary)}
.card-body{padding:18px 22px 22px}
.filter-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:12px 18px}
.field{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center}
.label{font-size:13px;font-weight:800;color:#59667a}
.control input,.control select{
  width:100%;border:1px solid var(--border);border-radius:9px;padding:9px 10px;outline:none;background:#fff
}
.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filter-actions{display:flex;justify-content:center;gap:8px;margin-top:14px}
.summary-line{
  display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px
}
.summary-text{font-size:14px;font-weight:800}
.summary-text strong{color:var(--primary)}
.table-wrap{border:1px solid var(--border);border-radius:12px;overflow:auto}
table{width:100%;border-collapse:collapse;min-width:1400px}
th{
  background:var(--soft);color:#59667a;font-size:12px;font-weight:800;
  padding:11px 8px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);text-align:center
}
td{
  padding:10px 8px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);
  font-size:13px;vertical-align:middle
}
th:last-child,td:last-child{border-right:0}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fbfcff}
.center{text-align:center}
.survey-title{font-weight:800;line-height:1.45}
.survey-meta{font-size:11px;color:var(--muted);margin-top:4px}
.status-select{width:100%;border:1px solid var(--border);border-radius:8px;padding:7px 8px;background:#fff}
.badge{
  display:inline-flex;align-items:center;justify-content:center;padding:5px 9px;border-radius:999px;
  font-size:12px;font-weight:800
}
.badge.wait{background:#f2f4f7;color:#768297}
.badge.active{background:#eaf8f0;color:var(--success)}
.badge.end{background:#fdecec;color:var(--danger)}
.action-stack{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.mini-btn{
  border:1px solid var(--border);background:#fff;color:#44536b;
  border-radius:7px;padding:6px 8px;font-size:12px;font-weight:800
}
.mini-btn.preview{background:#f7faff;color:var(--primary)}
.mini-btn.result{background:#eef7ff;color:#1f6feb}
.mini-btn.print{background:#f2efff;color:var(--purple)}
.mini-btn.delete{color:var(--danger)}
.bottom-bar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:14px;flex-wrap:wrap}
.pager{display:flex;gap:6px}
.page-btn{
  min-width:34px;height:34px;border:1px solid var(--border);background:#fff;border-radius:8px;font-weight:800
}
.page-btn.active{background:var(--primary);border-color:var(--primary);color:#fff}
.footer-note{margin-top:14px;text-align:right;color:var(--muted);font-size:12px}
@media(max-width:1000px){.filter-grid{grid-template-columns:1fr}}
@media(max-width:650px){.page{padding:0 10px}.page-header{flex-direction:column}.field{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="page">
  <header class="page-header">
    <div class="page-title">
      <h1>설문조사</h1>
      <p>과정별 설문조사를 등록하고 상태, 응답결과, 개별출력을 관리합니다.</p>
    </div>
    <div>
      <button class="btn btn-primary" onclick="addSurvey()">+ 설문 추가</button>
    </div>
  </header>

  <section class="card">
    <div class="card-head">
      <div class="section-title">검색조건</div>
      <div style="font-size:12px;color:var(--muted)">과정명 또는 설문명으로 조회</div>
    </div>
    <div class="card-body">
      <div class="filter-grid">
        <div class="field">
          <div class="label">검색조건</div>
          <div class="control inline">
            <select id="searchType" style="max-width:130px">
              <option value="all">과정명/설문명</option>
              <option value="course">과정명</option>
              <option value="survey">설문조사명</option>
            </select>
            <input id="keyword" type="text" placeholder="검색어를 입력하세요.">
          </div>
        </div>

        <div class="field">
          <div class="label">설문상태</div>
          <div class="control">
            <select id="statusFilter">
              <option value="전체">전체</option>
              <option value="대기">대기</option>
              <option value="설문중">설문중</option>
              <option value="종료">종료</option>
            </select>
          </div>
        </div>

        <div class="field">
          <div class="label">운영대장용</div>
          <div class="control">
            <select id="typeFilter">
              <option value="전체">전체</option>
              <option value="과정">과정</option>
              <option value="취업">취업</option>
              <option value="사전">사전</option>
              <option value="기타">기타</option>
            </select>
          </div>
        </div>
      </div>

      <div class="filter-actions">
        <button class="btn btn-primary" onclick="applyFilters()">검색</button>
        <button class="btn" onclick="resetFilters()">초기화</button>
        <button class="btn" onclick="questionManage()">질문관리</button>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="card-head">
      <div class="section-title">설문조사 목록</div>
      <div style="font-size:12px;color:var(--muted)">미리보기 / 결과보기 / 개별출력 / 수정 / 삭제</div>
    </div>
    <div class="card-body">
      <div class="summary-line">
        <div class="summary-text">Total : <strong id="totalCount">0</strong>, Page : <strong id="pageText">1/1</strong></div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>과정명 / 설문조사명</th>
              <th style="width:160px">구분(운영대장용)</th>
              <th style="width:85px">회차</th>
              <th style="width:90px">답변자</th>
              <th style="width:120px">설문상태</th>
              <th style="width:110px">미리보기</th>
              <th style="width:180px">결과보기</th>
              <th style="width:150px">관리</th>
            </tr>
          </thead>
          <tbody id="surveyBody"></tbody>
        </table>
      </div>

      <div class="bottom-bar">
        <button class="btn btn-primary" onclick="addSurvey()">+ 추가</button>
        <div class="pager" id="pager"></div>
      </div>
    </div>
  </section>

  <div class="footer-note">LMS 관리자 · 설문조사 관리</div>
</div>

<script>
const PAGE_SIZE = 6;
let currentPage = 1;

const surveys = [
  {
    course:"모바일 디바이스를 위한 UI 디자인 (2026.03.04~2026.12.27)",
    survey:"사전평가",
    type:"사전",
    round:"1회차",
    respondents:18,
    status:"대기"
  },
  {
    course:"[공개] 취업 희망 희망직종",
    survey:"취업희망직종 조사",
    type:"취업",
    round:"1회차",
    respondents:23,
    status:"설문중"
  },
  {
    course:"AI 에이전트 클라우드·보안코딩 개발자 양성",
    survey:"교육과정 만족도 조사",
    type:"과정",
    round:"2회차",
    respondents:21,
    status:"설문중"
  },
  {
    course:"재직자를 위한 고급 JAVA 개발",
    survey:"사전설문",
    type:"사전",
    round:"1회차",
    respondents:16,
    status:"종료"
  },
  {
    course:"UI/UX 실무 디자이너 양성과정",
    survey:"중간 만족도 조사",
    type:"과정",
    round:"1회차",
    respondents:19,
    status:"설문중"
  },
  {
    course:"커피 바리스타 자격증 대비반",
    survey:"교육 만족도 조사",
    type:"과정",
    round:"1회차",
    respondents:14,
    status:"종료"
  },
  {
    course:"한식 조리사 자격증 대비반",
    survey:"수료 후 진로 조사",
    type:"기타",
    round:"1회차",
    respondents:12,
    status:"대기"
  }
];

function getFiltered(){
  const keyword=document.getElementById("keyword").value.trim().toLowerCase();
  const type=document.getElementById("typeFilter").value;
  const status=document.getElementById("statusFilter").value;
  const searchType=document.getElementById("searchType").value;

  return surveys.filter(s=>{
    if(type!=="전체" && s.type!==type) return false;
    if(status!=="전체" && s.status!==status) return false;

    if(keyword){
      let target="";
      if(searchType==="course") target=s.course;
      else if(searchType==="survey") target=s.survey;
      else target=s.course+" "+s.survey;

      if(!target.toLowerCase().includes(keyword)) return false;
    }
    return true;
  });
}

function render(){
  const filtered=getFiltered();
  const total=filtered.length;
  const totalPage=Math.max(1,Math.ceil(total/PAGE_SIZE));
  if(currentPage>totalPage) currentPage=totalPage;

  const items=filtered.slice((currentPage-1)*PAGE_SIZE,currentPage*PAGE_SIZE);
  const body=document.getElementById("surveyBody");
  body.innerHTML="";

  items.forEach(s=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`
      <td>
        <div class="survey-title">${s.course}</div>
        <div class="survey-meta">설문명 · ${s.survey}</div>
      </td>
      <td class="center">
        <select class="status-select" onchange="changeType('${s.survey}',this.value)">
          ${["과정","취업","사전","기타"].map(v=>`<option ${s.type===v?"selected":""}>${v}</option>`).join("")}
        </select>
      </td>
      <td class="center">${s.round}</td>
      <td class="center"><strong>${s.respondents}명</strong></td>
      <td class="center">
        <select class="status-select" onchange="changeStatus('${s.survey}',this.value)">
          ${["대기","설문중","종료"].map(v=>`<option ${s.status===v?"selected":""}>${v}</option>`).join("")}
        </select>
      </td>
      <td class="center">
        <button class="mini-btn preview" onclick="previewSurvey('${s.survey}')">미리보기</button>
      </td>
      <td class="center">
        <div class="action-stack">
          <button class="mini-btn result" onclick="viewResult('${s.survey}')">결과보기</button>
          <button class="mini-btn print" onclick="printIndividual('${s.survey}')">개별출력</button>
        </div>
      </td>
      <td class="center">
        <div class="action-stack">
          <button class="mini-btn" onclick="editSurvey('${s.survey}')">수정</button>
          <button class="mini-btn delete" onclick="deleteSurvey('${s.survey}')">삭제</button>
        </div>
      </td>
    `;
    body.appendChild(tr);
  });

  document.getElementById("totalCount").textContent=total;
  document.getElementById("pageText").textContent=`${currentPage}/${totalPage}`;
  renderPager(totalPage);
}

function renderPager(totalPage){
  const pager=document.getElementById("pager");
  pager.innerHTML="";

  for(let i=1;i<=totalPage;i++){
    const btn=document.createElement("button");
    btn.className="page-btn"+(i===currentPage?" active":"");
    btn.textContent=i;
    btn.onclick=()=>{currentPage=i;render();};
    pager.appendChild(btn);
  }
}

function applyFilters(){currentPage=1;render();}
function resetFilters(){
  document.getElementById("keyword").value="";
  document.getElementById("statusFilter").value="전체";
  document.getElementById("typeFilter").value="전체";
  document.getElementById("searchType").value="all";
  currentPage=1;
  render();
}

function changeType(name,value){
  const s=surveys.find(x=>x.survey===name);
  if(s)s.type=value;
}
function changeStatus(name,value){
  const s=surveys.find(x=>x.survey===name);
  if(s)s.status=value;
}
function previewSurvey(name){alert(`"${name}" 설문 미리보기 화면으로 이동합니다.`)}
function viewResult(name){alert(`"${name}" 설문 결과 화면으로 이동합니다.`)}
function printIndividual(name){alert(`"${name}" 응답자별 개별출력 화면으로 이동합니다.`)}
function editSurvey(name){alert(`"${name}" 설문 수정 화면으로 이동합니다.`)}
function questionManage(){alert("설문 질문 관리 화면으로 이동합니다.")}
function addSurvey(){alert("설문조사 등록 화면으로 이동합니다.")}
function deleteSurvey(name){
  if(!confirm(`"${name}" 설문을 삭제하시겠습니까?`)) return;
  const idx=surveys.findIndex(x=>x.survey===name);
  if(idx>-1){surveys.splice(idx,1);render();}
}

render();
</script>
</body>
</html>
